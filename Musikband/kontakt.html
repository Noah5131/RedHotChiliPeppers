<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="bootstrap_class/css/bootstrap.min.css" rel="stylesheet">
    <link href="band.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">

</head>


<body id="contact">
    <div class="container my-5">
        <div class="col-md-15 mx-auto">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Email Addresse</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Nachricht</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>


            <div class="mb-3">
                <label for="formFile" class="form-label">Bild Hochladen</label>
                <input class="form-control" type="file" id="formFile">
            </div>


            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                <label class="form-check-label" for="checkIndeterminate">
                    Ich akzeptiere die Datenschutzerklärung.
                </label>
            </div>


            <input class="btn btn-color" type="submit" value="Senden">

            <a href="index.html" class="btn btn-secondary">
                Zurück
            </a>
        </div>
    </div>
</body>
